---
- name: reload systemd
  systemd:
    daemon_reload: true

- name: restart nfs server
  service:
    name: "{{ nfs_server_service }}"
    state: restarted

- name: restart snapraid-runner
  systemd:
    name: snapraid-runner.timer
    state: "{{ 'restarted' if snapraid_maintenance.sync_enabled else 'stopped' }}"
    enabled: "{{ snapraid_maintenance.sync_enabled }}"

- name: restart snapraid-scrub
  systemd:
    name: snapraid-scrub.timer
    state: "{{ 'restarted' if snapraid_maintenance.scrub_enabled else 'stopped' }}"
    enabled: "{{ snapraid_maintenance.scrub_enabled }}"

- name: reload nfs exports # noqa: no-changed-when
  command: exportfs -ra
  listen: reload nfs exports

- name: restart networking debian
  service:
    name: networking
    state: restarted
  listen: restart networking debian

- name: restart networking redhat
  service:
    name: NetworkManager
    state: restarted
  listen: restart networking redhat
