---
prerun: false
shared_state: false
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
  safe_files:
    - ${MOLECULE_EPHEMERAL_DIRECTORY}/vms/*/*.log
    - ${MOLECULE_EPHEMERAL_DIRECTORY}/ansible.log
    - ${MOLECULE_EPHEMERAL_DIRECTORY}/vms/base.qcow2
platforms:
  - name: nfs-server
    groups: [nfs_servers]
  - name: nfs-client-a
    groups: [nfs_clients]
  - name: nfs-client-b
    groups: [nfs_clients]
provisioner:
  name: ansible
  log: true
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      host_key_checking: false
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3
      nfs_servers:
        disk_directories: [/mnt/data1, /mnt/data2]
        parity_directories: []
        nfs_server_service: nfs-kernel-server
        homelab_net_cidr: 10.0.2.2/32
        manage_firewall: false
        validate_nfs: false
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
