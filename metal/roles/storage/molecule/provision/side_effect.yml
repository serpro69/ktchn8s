---
- name: Place independent test data between the first and second applies
  hosts: nas
  gather_facts: false
  tasks:
    - ansible.builtin.copy:
        content: "storage provisioning sentinel\n"
        dest: /mnt/storage/10_documents/sentinel
        mode: '0644'
    - name: Verify xz-utils is installed before the retry
      ansible.builtin.command: dpkg-query -W -f=${db:Status-Status} xz-utils
      register: installed_xz
      failed_when: installed_xz.rc != 0 or installed_xz.stdout != 'installed'
      changed_when: false
    - name: Simulate an unloaded module with its persistence file still present
      ansible.builtin.command: modprobe -r drivetemp
      changed_when: true
    - name: Exercise recovery before the zero-change idempotence run
      ansible.builtin.import_role:
        name: storage
        tasks_from: drivetemp.yml
    - name: Require recovery to have loaded the kernel module
      ansible.builtin.command: test -d /sys/module/drivetemp
      changed_when: false
