---
- name: Recheck the complete admission result immediately before formatting or mounting
  ansible.builtin.import_tasks: probe_disks.yml
  check_mode: false

- name: Require the same admitted disks and signatures before mutation
  ansible.builtin.assert:
    that: (storage_disk_probe.stdout | from_json) == storage_branches
    fail_msg: Storage admission changed after the initial probe. Check the inventory and mounts before retrying.

- name: Format only admitted and explicitly authorized blank partitions
  community.general.filesystem:
    fstype: ext4
    dev: "{{ item.device }}"
    opts: "-L {{ item.mount | basename }}"
    force: false
  loop: "{{ storage_branches | selectattr('state', 'equalto', 'blank') }}"
  loop_control:
    label: "{{ item.device }}"

- name: Persist and mount the admitted filesystems
  ansible.posix.mount:
    path: "{{ item.mount }}"
    src: "{{ item.device }}"
    fstype: ext4
    opts: defaults,noatime
    passno: "2"
    state: mounted
    backup: true
  loop: "{{ storage_branches }}"
  loop_control:
    label: "{{ item.device }} -> {{ item.mount }}"

- name: Require every inventory partition at its intended mount before creating the pool
  ansible.builtin.import_tasks: probe_disks.yml
  vars:
    storage_probe_flags: ['--mounted']
  when: not ansible_check_mode
