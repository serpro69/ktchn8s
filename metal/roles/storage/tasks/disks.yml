---
- name: Recheck the complete admission result immediately before formatting or mounting
  ansible.builtin.script:
    cmd: storage-disks.py {{ data_drives | to_json | quote }} {{ parity_drives | to_json | quote }}
    executable: /usr/bin/python3
  register: storage_current_disks
  changed_when: false
  check_mode: false
  failed_when: storage_current_disks.rc != 0 or (storage_current_disks.stdout | from_json) != storage_branches

- name: Format only admitted and explicitly authorized blank partitions
  community.general.filesystem:
    fstype: ext4
    dev: "{{ item.device }}"
    opts: "-L {{ item.mount | basename }}"
    force: false
  loop: "{{ storage_branches | selectattr('state', 'equalto', 'blank') }}"
  loop_control:
    label: "{{ item.device }}"

- name: Persist and mount the admitted filesystems
  ansible.posix.mount:
    path: "{{ item.mount }}"
    src: "{{ item.device }}"
    fstype: ext4
    opts: defaults,noatime
    passno: "2"
    state: mounted
    backup: true
  loop: "{{ storage_branches }}"
  loop_control:
    label: "{{ item.device }} -> {{ item.mount }}"

- name: Require every inventory partition at its intended mount before creating the pool
  ansible.builtin.script:
    cmd: storage-disks.py {{ data_drives | to_json | quote }} {{ parity_drives | to_json | quote }} --mounted
    executable: /usr/bin/python3
  changed_when: false
