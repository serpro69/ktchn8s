---
- name: Set global facts
  include_tasks: facts.yml

- name: Require at least one data drive when provisioning parity
  ansible.builtin.assert:
    that: data_drives | length > 0 or parity_drives | length == 0

- name: Admit the complete drive inventory before changing disks or services
  when: data_drives | length > 0
  block:
    - name: Inspect storage partition identities, signatures and current backing mounts
      ansible.builtin.script:
        cmd: storage-disks.py {{ data_drives | to_json | quote }} {{ parity_drives | to_json | quote }}
        executable: /usr/bin/python3
      register: storage_disk_probe
      changed_when: false
      check_mode: false

    - name: Retain verified branch and physical disk identities
      ansible.builtin.set_fact:
        storage_branches: "{{ storage_disk_probe.stdout | from_json }}"

    - name: Check parity transition policy before disk or configuration changes
      ansible.builtin.include_tasks: parity_policy.yml
      when: parity_drives | length > 0

- include_tasks: setup_redhat.yml # noqa name[missing]
  when: ansible_os_family == 'RedHat'

- include_tasks: setup_debian.yml # noqa name[missing]
  when: ansible_os_family == 'Debian'

- name: Include network configuration
  include_tasks: network.yml
  when: configure_network | bool

- name: Install the pinned SnapRAID binary
  ansible.builtin.include_tasks: install_snapraid.yml

- name: Configure drive temperature monitoring
  ansible.builtin.include_tasks: drivetemp.yml

- name: Detect sensors once when hardware monitoring is requested
  shell: sensors-detect --auto && touch /var/lib/storage-sensors-detected
  args:
    creates: /var/lib/storage-sensors-detected
  when: enable_disk_health_checks | bool

- name: Validate disk health
  include_tasks: disk_health.yml
  when:
    - enable_disk_health_checks | default(false)
    - (data_drives is defined and data_drives | length > 0) or (parity_drives is defined and parity_drives | length > 0)

- name: Include disk management tasks
  include_tasks: disks.yml
  when: data_drives is defined and data_drives | length > 0

- name: Include mergerfs configuration
  include_tasks: mergerfs.yml
  when:
    - data_drives is defined
    - data_drives | length > 0
    - disk_directories is defined

- name: Check snapraid prerequisites
  debug:
    msg: "Skipping snapraid configuration: requires both parity_drives and data_drives to be populated"
  when: >
    (parity_drives is not defined or parity_drives | length == 0) or
    (data_drives is not defined or data_drives | length == 0)

- name: Include snapraid configuration
  include_tasks: snapraid.yml
  when:
    - parity_drives is defined
    - parity_drives | length > 0
    - data_drives is defined
    - data_drives | length > 0

- name: Include NFS server configuration
  include_tasks: nfs.yml
  when:
    - data_drives is defined
    - data_drives | length > 0
    - disk_directories is defined
