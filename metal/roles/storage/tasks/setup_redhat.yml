---
- name: Update all packages when requested
  ansible.builtin.dnf:
    name: "*"
    update_cache: true
    state: latest
  when: upgrade_packages

- name: Install NAS prerequisites
  ansible.builtin.dnf:
    name: [smartmontools, rsync, b3sum, lm_sensors, nfs-utils, logrotate, e2fsprogs, libstdc++]
    state: present

- name: Download the verified mergerfs RPM for this Fedora release
  ansible.builtin.get_url:
    url: "{{ mergerfs_url_rpm }}"
    checksum: "{{ mergerfs_checksums[mergerfs_pkg_rpm] }}"
    dest: "/var/cache/{{ mergerfs_pkg_rpm }}"
    mode: '0644'

- name: Install mergerfs
  ansible.builtin.dnf:
    name: "/var/cache/{{ mergerfs_pkg_rpm }}"
    # Upstream ships an unsigned RPM. Only the checksum-pinned local file
    # participates in this transaction. Distribution packages use normal GPG checks above.
    disablerepo: ['*']
    disable_gpg_check: true
    state: present
