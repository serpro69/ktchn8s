---
# Configuration only: a parity file can be partial or predate a new parity level.
# The operator must stop/disable maintenance, await running jobs and complete the
# runbook's safety gates before explicitly starting this unit. Never enable it.
- name: Deploy explicit full-sync systemd service
  template:
    src: snapraid-initial-sync.service.j2
    dest: /etc/systemd/system/snapraid-initial-sync.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd
