---
- name: Collect a SMART result for every selected whole disk
  ansible.builtin.script:
    cmd: smart-report.py {{ all_health_check_devices | map('quote') | join(' ') }}
    executable: /usr/bin/python3
  register: storage_smart_results
  changed_when: false

- name: Retain successful, failing and unreadable SMART results
  ansible.builtin.set_fact:
    disk_health_report: "{{ disk_health_report + (storage_smart_results.stdout | from_json) }}"
