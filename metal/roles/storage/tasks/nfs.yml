---
- name: Create NFS export configuration
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - reload nfs exports
    - restart nfs server

- name: Set proper ownership for NFS shares
  file:
    path: "/mnt/storage/{{ item }}"
    owner: "{{ nfs_anon_uid }}"
    group: "{{ nfs_anon_gid }}"
    mode: "0775"
    state: directory
  loop: "{{ storage_dirs }}"

- name: Render storage layout legend
  template:
    src: storage-readme.j2
    dest: /mnt/storage/00_meta/README.md
    owner: "{{ nfs_anon_uid }}"
    group: "{{ nfs_anon_gid }}"
    mode: "0644"

- name: Initialize storage retirement log without overwriting entries
  copy:
    content: ""
    dest: /mnt/storage/00_meta/RETIRED.md
    force: false
    owner: "{{ nfs_anon_uid }}"
    group: "{{ nfs_anon_gid }}"
    mode: "0644"

- name: Ensure nfs.conf.d include directory exists
  file:
    path: /etc/nfs.conf.d
    state: directory
    mode: "0755"

- name: Disable NFSv3 (serve NFSv4 only)
  copy:
    content: |
      [nfsd]
      vers3=n
      vers4=y
      vers4.1=y
      vers4.2=y
    dest: /etc/nfs.conf.d/local.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart nfs server

- name: Disable rpcbind and its socket activation for NFSv4-only
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: [rpcbind.socket, rpcbind.service]

- name: Enable and start NFS server
  service:
    name: "{{ nfs_server_service }}"
    state: started
    enabled: true

- name: Configure firewall for NFS
  include_tasks: nfs_firewall.yml
  when: manage_firewall

- name: Flush handlers before validation
  meta: flush_handlers

# Compatibility for existing callers; prefer storage-validate after cluster creation.
- name: Run explicitly requested post-install NFS validation
  ansible.builtin.include_role:
    name: nfs_validation
  when: validate_nfs | bool
