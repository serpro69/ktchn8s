---
- name: Create NFS export configuration
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - reload nfs exports
    - restart nfs server

- name: Set proper ownership for NFS shares
  file:
    path: "/mnt/storage/{{ item }}"
    owner: "{{ nfs_anon_uid }}"
    group: "{{ nfs_anon_gid }}"
    mode: "0775"
    state: directory
  loop: "{{ storage_dirs }}"

- name: Render storage layout legend
  template:
    src: storage-readme.j2
    dest: /mnt/storage/00_meta/README.md
    owner: "{{ nfs_anon_uid }}"
    group: "{{ nfs_anon_gid }}"
    mode: "0644"

- name: Initialize storage retirement log without overwriting entries
  copy:
    content: ""
    dest: /mnt/storage/00_meta/RETIRED.md
    force: false
    owner: "{{ nfs_anon_uid }}"
    group: "{{ nfs_anon_gid }}"
    mode: "0644"

- name: Ensure nfs.conf.d include directory exists
  file:
    path: /etc/nfs.conf.d
    state: directory
    mode: "0755"

- name: Disable NFSv3 (serve NFSv4 only)
  copy:
    content: |
      [nfsd]
      vers3=n
      vers4=y
      vers4.1=y
      vers4.2=y
    dest: /etc/nfs.conf.d/local.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart nfs server

- name: Disable rpcbind and its socket activation for NFSv4-only
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: [rpcbind.socket, rpcbind.service]

- name: Enable and start NFS server
  service:
    name: "{{ nfs_server_service }}"
    state: started
    enabled: true

- name: Configure firewall for NFS
  include_tasks: nfs_firewall.yml
  when: manage_firewall

- name: Flush handlers before validation
  meta: flush_handlers

- name: Validate scoped NFS operations and required Kubernetes integration
  when: validate_nfs
  block:
    - name: Initialize ownership and client teardown state for this validation run
      set_fact:
        nfs_readiness_created: {changed: false}
        nfs_readiness_local_clean: true
        nfs_readiness_k8s_clean: true

    - name: Prepare the shared readiness fixture
      include_tasks: nfs_readiness_server.yml

    - name: Validate NFS exports
      include_tasks: nfs_validation.yml

    - name: Validate NFS-K8S integration
      include_tasks:
        file: k8s_validation.yml
        apply:
          become: false
          delegate_to: localhost
  always:
    - name: Remove this run's synthetic fixture after clients are removed
      file:
        path: /mnt/storage/99_tmp/nfs-readiness
        state: absent
      when:
        - nfs_readiness_created is defined and nfs_readiness_created is changed
        - nfs_readiness_local_clean | default(false)
        - nfs_readiness_k8s_clean | default(false)

    - name: Preserve the fixture when client teardown did not complete
      debug:
        msg: "Client teardown failed; preserve /mnt/storage/99_tmp/nfs-readiness until clients are removed."
      when:
        - nfs_readiness_created is defined and nfs_readiness_created is changed
        - not (nfs_readiness_local_clean | default(false)) or not (nfs_readiness_k8s_clean | default(false))
