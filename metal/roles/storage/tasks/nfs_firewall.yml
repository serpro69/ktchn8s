---
- name: Install UFW when requested
  ansible.builtin.package:
    name: ufw
    state: present
  when: install_ufw | bool

- name: Check UFW availability
  ansible.builtin.command: which ufw
  register: storage_ufw
  failed_when: storage_ufw.rc not in [0, 1]
  changed_when: false
  check_mode: false

- name: Apply controller and NFS firewall policy
  ansible.builtin.include_tasks: ufw_policy.yml
  when: storage_ufw.rc == 0

- name: Report when optional UFW installation is disabled
  ansible.builtin.debug:
    msg: UFW is absent. The operator manages the NAS firewall.
  when: storage_ufw.rc != 0 and not install_ufw
