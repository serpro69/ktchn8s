---
- name: Check whether usable package indexes exist
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: '*_Packages*'
    file_type: file
  register: storage_apt_indexes

- name: Install NAS prerequisites using current APT metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 3600 if storage_apt_indexes.matched else 0 }}"
    name: [smartmontools, rsync, b3sum, lm-sensors, nfs-kernel-server, nfs-common, xz-utils, logrotate, e2fsprogs]

- name: Upgrade packages when requested
  ansible.builtin.apt:
    upgrade: dist
  when: upgrade_packages

- name: Verify the packaged checksum tool
  ansible.builtin.shell: |
    set -eu
    tool=$(command -v b3sum)
    dpkg-query -S "$(readlink -e "$tool")"
  register: storage_b3sum_owner
  changed_when: false
  failed_when: >-
    storage_b3sum_owner.rc != 0 or storage_b3sum_owner.stdout != 'b3sum: /usr/bin/b3sum'

- name: Download the verified mergerfs DEB for this release
  ansible.builtin.get_url:
    url: "{{ mergerfs_url_deb }}"
    checksum: "{{ mergerfs_checksums[mergerfs_pkg_deb] }}"
    dest: "/var/cache/{{ mergerfs_pkg_deb }}"
    mode: '0644'

- name: Install mergerfs
  ansible.builtin.apt:
    deb: "/var/cache/{{ mergerfs_pkg_deb }}"
